<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecentraBlog - Post</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #ffffff;
            --surface: #fafaf8;
            --accent: #c8a96e;
            --text-primary: #111111;
            --text-secondary: #555555;
            --text-muted: #888888;
            --border: #e8e8e8;
            --success: #22c55e;
            --danger: #dc2626;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.7;
        }

        .wrap {
            max-width: 920px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 18px;
            margin-bottom: 24px;
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .status {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            margin-bottom: 18px;
            font-size: 14px;
        }

        .status.success {
            border-color: var(--success);
            color: var(--success);
            background: rgba(34, 197, 94, 0.06);
        }

        .status.error {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(220, 38, 38, 0.06);
        }

        .meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 18px;
        }

        .meta-item {
            font-size: 12px;
            color: var(--text-muted);
        }

        .tag {
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            text-transform: uppercase;
            border-radius: 2px;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: 46px;
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .author {
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            margin-bottom: 22px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }

        .author-name {
            font-weight: 700;
            font-size: 14px;
        }

        .author-did {
            font-family: "Space Mono", monospace;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .content {
            font-size: 16px;
            color: var(--text-primary);
            white-space: pre-wrap;
            margin-bottom: 26px;
        }

        .tech {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            display: grid;
            gap: 10px;
        }

        .tech-row {
            font-size: 12px;
            display: grid;
            gap: 4px;
        }

        .tech-label {
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .mono {
            font-family: "Space Mono", monospace;
            color: var(--text-muted);
            word-break: break-all;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 34px;
            }

            .wrap {
                padding: 20px 16px 48px;
            }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <header class="topbar">
            <a class="logo" href="index.html">Decentra<span>Blog</span></a>
            <a class="back-link" href="index.html">Back to Feed</a>
        </header>

        <div id="notice" class="status">Loading post...</div>

        <article id="postView" style="display:none;">
            <div class="meta">
                <span class="meta-item" id="publishedAt"></span>
                <span class="tag" id="verifyTag">UNVERIFIED</span>
                <span id="tagsWrap"></span>
            </div>

            <h1 id="postTitle"></h1>

            <section class="author">
                <div class="avatar" id="authorInitial"></div>
                <div>
                    <div class="author-name" id="authorName"></div>
                    <div class="author-did" id="authorDid"></div>
                </div>
            </section>

            <section class="content" id="postBody"></section>

            <section class="tech">
                <div class="tech-row">
                    <div class="tech-label">Content Hash</div>
                    <div class="mono" id="contentHash"></div>
                </div>
                <div class="tech-row">
                    <div class="tech-label">Signature</div>
                    <div class="mono" id="signature"></div>
                </div>
                <div class="tech-row">
                    <div class="tech-label">Recovered Address</div>
                    <div class="mono" id="recoveredAddress"></div>
                </div>
            </section>
        </article>
    </main>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        function setNotice(message, type = '') {
            const el = document.getElementById('notice');
            el.className = `status ${type}`.trim();
            el.textContent = message;
        }

        function formatDate(value) {
            const date = new Date(value);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                setNotice('Missing post id in URL.', 'error');
                return;
            }

            try {
                const postRes = await fetch(`${API_BASE}/posts/${id}`);
                const postData = await postRes.json();
                if (!postRes.ok) {
                    throw new Error(postData.error || 'Unable to fetch post');
                }

                const verifyRes = await fetch(`${API_BASE}/posts/${id}/verify`);
                const verifyData = await verifyRes.json();
                if (!verifyRes.ok) {
                    throw new Error(verifyData.error || 'Unable to verify post');
                }

                document.getElementById('postTitle').textContent = postData.title;
                document.getElementById('postBody').textContent = postData.body;
                document.getElementById('publishedAt').textContent = formatDate(postData.published_at);

                const authorName = postData.author?.display_name || 'Anonymous';
                const authorDid = postData.author_did || postData.author?.did || 'did:eth:unknown';
                document.getElementById('authorName').textContent = authorName;
                document.getElementById('authorDid').textContent = authorDid;
                document.getElementById('authorInitial').textContent = authorName.charAt(0).toUpperCase();

                document.getElementById('contentHash').textContent = postData.content_hash || 'N/A';
                document.getElementById('signature').textContent = postData.signature || 'N/A';
                document.getElementById('recoveredAddress').textContent = verifyData.recovered_address || 'N/A';

                const verifyTag = document.getElementById('verifyTag');
                if (verifyData.valid) {
                    verifyTag.textContent = 'VERIFIED';
                    verifyTag.style.borderColor = '#22c55e';
                    verifyTag.style.color = '#22c55e';
                } else {
                    verifyTag.textContent = 'INVALID';
                    verifyTag.style.borderColor = '#dc2626';
                    verifyTag.style.color = '#dc2626';
                }

                const tagsWrap = document.getElementById('tagsWrap');
                const tags = Array.isArray(postData.tags) ? postData.tags : [];
                tagsWrap.innerHTML = tags.map(t => `<span class="tag" style="margin-right:6px;">${t}</span>`).join('');

                document.getElementById('postView').style.display = 'block';
                setNotice('Post loaded successfully.', 'success');
            } catch (error) {
                setNotice(error.message || 'Failed to load post.', 'error');
            }
        }

        loadPost();
    </script>
</body>
</html>
